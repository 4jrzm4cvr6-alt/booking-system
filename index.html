<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎫 Booking System</h1>
            <p>Book your appointments easily</p>
        </header>

        <main>
            <section class="booking-form">
                <h2>Make a Booking</h2>
                <form id="bookingForm">
                    <div class="form-group">
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number" required>
                    </div>

                    <div class="form-group">
                        <label for="service">Service:</label>
                        <select id="service" required>
                            <option value="">-- Select a service --</option>
                            <option value="haircut">Haircut</option>
                            <option value="massage">Massage</option>
                            <option value="dental">Dental Checkup</option>
                            <option value="consultation">Consultation</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Preferred Date:</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="time">Preferred Time:</label>
                        <input type="time" id="time" required>
                    </div>

                    <div class="form-group">
                        <label for="notes">Additional Notes:</label>
                        <textarea id="notes" placeholder="Any special requests?" rows="4"></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Book Appointment</button>
                </form>
            </section>

            <section class="bookings-list">
                <h2>Your Bookings</h2>
                <div id="bookingsList" class="bookings-container">
                    <p class="empty-message">No bookings yet. Make your first booking!</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
